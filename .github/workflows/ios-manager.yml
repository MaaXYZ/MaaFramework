name: iOS manager

on:
    workflow_dispatch:
    pull_request:
        paths:
            - '.github/workflows/ios-manager.yml'
            - 'source/MaaIOSControlUnit/**'
            - 'source/MaaToolkit/**'
            - 'source/MaaFramework/**'
            - 'include/MaaFramework/**'
            - 'include/MaaControlUnit/**'
            - 'source/LibraryHolder/**'
            - 'source/include/LibraryHolder/**'
            - 'source/binding/Python/maa/toolkit.py'
            - 'test/python/ios_management_test.py'
            - 'include/MaaToolkit/**'
            - 'test/ios_test/**'
            - 'CMakeLists.txt'
            - 'tools/MaaIOSManager/**'
    push:
        branches: ['feat/ios-control-unit', 'main']
        paths:
            - '.github/workflows/ios-manager.yml'
            - 'source/MaaIOSControlUnit/**'
            - 'source/MaaToolkit/**'
            - 'source/MaaFramework/**'
            - 'include/MaaFramework/**'
            - 'include/MaaControlUnit/**'
            - 'source/LibraryHolder/**'
            - 'source/include/LibraryHolder/**'
            - 'source/binding/Python/maa/toolkit.py'
            - 'test/python/ios_management_test.py'
            - 'include/MaaToolkit/**'
            - 'test/ios_test/**'
            - 'CMakeLists.txt'
            - 'tools/MaaIOSManager/**'

permissions:
    contents: read

concurrency:
    group: ios-manager-${{ github.event.pull_request.number || github.ref }}
    # Retain results from the long native dependency builds when a new fix queues.
    cancel-in-progress: false

jobs:
    framework-integration:
        name: Framework iOS integration (${{ matrix.platform }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-arm64
                      runner: macos-15
                      maadeps: arm64-osx
                    - platform: linux-x64
                      runner: ubuntu-24.04
                      maadeps: x64-linux
                    - platform: windows-msvc-x64
                      runner: windows-2022
                      maadeps: x64-windows
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 90
        env:
            VCPKG_BINARY_SOURCES: clear
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive
                  persist-credentials: false

            - name: Native MaaFramework dependencies
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: python3 tools/maadeps-download.py '${{ matrix.maadeps }}'

            - name: Linux protocol dependencies
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  sudo apt-get update
                  sudo apt-get install -y cmake ninja-build pkg-config libssl-dev libcurl4-openssl-dev libavcodec-dev libavutil-dev libswscale-dev libdbus-1-dev libwayland-dev libffi-dev

            - name: macOS protocol dependencies
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  test "$(uname -m)" = arm64
                  brew install cmake ninja pkg-config openssl@3 ffmpeg

            - name: Pinned Windows vcpkg checkout
              if: runner.os == 'Windows'
              uses: actions/checkout@v7
              with:
                  repository: microsoft/vcpkg
                  ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
                  path: .ios-vcpkg
                  persist-credentials: false

            - name: Windows protocol dependencies
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  & ./.ios-vcpkg/bootstrap-vcpkg.bat -disableMetrics
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  & ./.ios-vcpkg/vcpkg.exe install --triplet x64-windows --host-triplet x64-windows `
                    --x-manifest-root="$pwd/tools/MaaIOSManager/ci" --x-install-root="$pwd/.ios-vcpkg/installed" `
                    --no-binarycaching
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  "$pwd/.ios-vcpkg/installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  "$pwd/source/MaaUtils/MaaDeps/runtime/maa-x64-windows" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Configure framework iOS integration
              shell: bash
              run: |
                  extra=()
                  if [[ "$RUNNER_OS" == macOS ]]; then
                    extra+=(-G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64 "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
                  elif [[ "$RUNNER_OS" == Linux ]]; then
                    # Native glibc + protocol C libraries; MaaDeps' matching libc++ ABI.
                    # This is separate from the portable release toolchain.
                    extra+=(-G Ninja "-DCMAKE_TOOLCHAIN_FILE=$PWD/tools/MaaIOSManager/ci/linux-native-toolchain.cmake"
                      -DOPENSSL_ROOT_DIR=/usr -DWITH_RPATH_LIBRARY=OFF)
                  else
                    extra+=(-G "Visual Studio 17 2022" -A x64
                      "-DCMAKE_TOOLCHAIN_FILE=$PWD/.ios-vcpkg/scripts/buildsystems/vcpkg.cmake"
                      -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_MODE=OFF
                      "-DVCPKG_INSTALLED_DIR=$PWD/.ios-vcpkg/installed")
                  fi
                  cmake -S . -B build "${extra[@]}" \
                    -DCMAKE_BUILD_TYPE=Release -DMAADEPS_TRIPLET='maa-${{ matrix.maadeps }}' \
                    -DWITH_IOS_CONTROLLER=ON -DBUILD_IOS_CONTROLLER_TESTING=ON \
                    -DBUILD_IOS_MANAGER_TESTING=ON -DMAA_IOS_PROTOCOL_TESTS=ON \
                    -DWITH_ADB_CONTROLLER=OFF -DWITH_WIN32_CONTROLLER=OFF -DWITH_MACOS_CONTROLLER=OFF \
                    -DWITH_PLAYCOVER_CONTROLLER=OFF -DWITH_GAMEPAD_CONTROLLER=OFF -DWITH_LINUX_CONTROLLER=OFF \
                    -DWITH_ANDROID_NATIVE_CONTROLLER=OFF -DWITH_MAA_AGENT=OFF \
                    -DWITH_NODEJS_BINDING=OFF -DWITH_QUICKJS_BINDING=OFF -DBUILD_PICLI=OFF

            - name: Build framework API, toolkit, session and tool
              shell: bash
              run: |
                  cmake --build build --config Release --parallel 3 \
                    --target MaaFramework MaaToolkit MaaIOSControlUnit MaaIOSManager
                  cmake --build build --config Release --parallel 3

            - name: Run framework and protocol offline tests
              shell: bash
              run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error --timeout 60

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Python management callback tests
              shell: bash
              env:
                  MAAFW_BINARY_PATH: ${{ github.workspace }}/build/bin/Release
                  PYTHONPATH: ${{ github.workspace }}/source/binding/Python
              run: |
                  python3 -m pip install numpy
                  python3 test/python/ios_management_test.py

            - name: Install framework and package manager runtime
              shell: bash
              run: |
                  cmake --install build --config Release --prefix "$PWD/build/ios-manager-artifact"
                  python tools/MaaIOSManager/ci/package.py --repository "$PWD" --build "$PWD/build" \
                    --output "$PWD/build/ios-manager-artifact" --platform "${{ matrix.platform }}"

            - name: Check packaged Windows C libraries and manager
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $python = (Get-Command python).Source
                  $env:PATH = "$pwd/build/ios-manager-artifact/bin;$env:SystemRoot/System32;$env:SystemRoot;$env:SystemRoot/System32/Wbem"
                  & $python -c "import ctypes,pathlib; root=pathlib.Path('build/ios-manager-artifact/bin').resolve(); cookies=[ctypes.WinDLL(str(root/name)) for name in ('MaaIOSControlUnit.dll','MaaToolkit.dll')]"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  & ./build/ios-manager-artifact/bin/MaaIOSManager.exe --help
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Upload manager and framework runtime
              uses: actions/upload-artifact@v7
              with:
                  name: MaaIOSManager-${{ matrix.platform }}
                  path: build/ios-manager-artifact/
                  include-hidden-files: true
                  if-no-files-found: error

            - name: Upload framework integration diagnostics
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: MaaIOSFramework-${{ matrix.platform }}-logs
                  include-hidden-files: true
                  path: |
                      build/CMakeCache.txt
                      build/CMakeFiles/CMakeConfigureLog.yaml
                      build/Testing/Temporary/
                      .ios-vcpkg/buildtrees/**/*.log
                  if-no-files-found: warn
