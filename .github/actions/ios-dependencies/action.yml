name: iOS host dependencies
description: Build target-compatible protocol dependencies for the framework
inputs:
    platform:
        description: Target platform (windows, linux, macos, android)
        required: true
    architecture:
        description: Target architecture (x86_64, aarch64)
        required: true
runs:
    using: composite
    steps:
        - name: Install iOS build tools on Linux
          if: runner.os == 'Linux'
          shell: bash
          run: |
              sudo apt-get update -y
              sudo apt-get install -y nasm ${{ inputs.platform == 'linux' && 'patchelf' || '' }}
        - name: Install iOS build tools on macOS
          if: runner.os == 'macOS'
          shell: bash
          run: brew install nasm
        - uses: actions/checkout@v7
          with:
              repository: microsoft/vcpkg
              ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
              path: build-ios-vcpkg
              persist-credentials: false
        - name: Bootstrap vcpkg
          if: runner.os != 'Windows'
          shell: bash
          run: ./build-ios-vcpkg/bootstrap-vcpkg.sh -disableMetrics
        - name: Bootstrap vcpkg on Windows
          if: runner.os == 'Windows'
          shell: pwsh
          run: |
              & ./build-ios-vcpkg/bootstrap-vcpkg.bat -disableMetrics
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        - name: Build protocol dependencies
          shell: bash
          env:
              MAA_IOS_PLATFORM: ${{ inputs.platform }}
              MAA_IOS_ARCHITECTURE: ${{ inputs.architecture }}
              VCPKG_MAX_CONCURRENCY: '3'
          run: |
              python3 tools/ios/ci/dependencies.py --vcpkg "$PWD/build-ios-vcpkg" \
                --work "$RUNNER_TEMP/maa-ios-dependencies" \
                --platform "$MAA_IOS_PLATFORM" --architecture "$MAA_IOS_ARCHITECTURE"
        - name: Enable iOS in the framework build
          shell: bash
          run: |
              printf '%s\n' 'set(WITH_IOS_CONTROLLER ON CACHE BOOL "Build iOS controller in CI" FORCE)' >> "$MAA_IOS_CMAKE"
